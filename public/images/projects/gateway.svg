<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-gw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.75)"/>
      <stop offset="100%" stop-color="rgba(2, 6, 23, 0.85)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-grad-gw)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="40" y="35" width="720" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="65" cy="55" r="4.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="82" cy="55" r="4.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="99" cy="55" r="4.5" fill="#10b981" opacity="0.8"/>
  <text x="130" y="59" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">edge-gw-router :: Go 1.23 Engine / gRPC Proxy</text>

  <!-- Metric Panels -->
  <rect x="40" y="95" width="225" height="105" rx="10" fill="url(#card-dark)" stroke="rgba(255,255,255,0.07)"/>
  <text x="60" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">THROUGHPUT CAPACITY</text>
  <text x="60" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="700">85,000 req/s</text>
  <text x="60" y="182" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">0-Alloc Goroutine Pool</text>

  <rect x="285" y="95" width="225" height="105" rx="10" fill="url(#card-dark)" stroke="rgba(255,255,255,0.07)"/>
  <text x="305" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">P99 OVERHEAD</text>
  <text x="305" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="700">3.8 ms</text>
  <text x="305" y="182" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">gRPC Multiplexing</text>

  <rect x="530" y="95" width="230" height="105" rx="10" fill="url(#card-dark)" stroke="rgba(255,255,255,0.07)"/>
  <text x="550" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">RATE LIMITING ENGINE</text>
  <text x="550" y="158" fill="#818cf8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Distributed</text>
  <text x="550" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Redis Cluster + Token Bucket</text>

  <!-- Network Routing Topology -->
  <rect x="40" y="220" width="720" height="240" rx="12" fill="url(#card-dark)" stroke="rgba(255,255,255,0.07)"/>
  
  <!-- Topology Nodes -->
  <g transform="translate(60, 240)">
    <!-- Edge Ingress -->
    <rect x="20" y="70" width="130" height="50" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="100" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Edge Ingress</text>

    <!-- Connectors -->
    <line x1="150" y1="95" x2="240" y2="95" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Go Gateway Core -->
    <rect x="240" y="50" width="180" height="90" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5"/>
    <text x="258" y="85" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Go Gateway Core</text>
    <text x="258" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">JWT Validation • Metrics</text>
    <text x="258" y="124" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Rate Limiter • Tracing</text>

    <!-- Microservices Out -->
    <line x1="420" y1="80" x2="510" y2="40" stroke="#818cf8" stroke-width="2"/>
    <line x1="420" y1="95" x2="510" y2="95" stroke="#818cf8" stroke-width="2"/>
    <line x1="420" y1="110" x2="510" y2="150" stroke="#818cf8" stroke-width="2"/>

    <rect x="510" y="20" width="150" height="40" rx="6" fill="rgba(129, 140, 248, 0.1)" stroke="#818cf8"/>
    <text x="525" y="45" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Auth Service (gRPC)</text>

    <rect x="510" y="75" width="150" height="40" rx="6" fill="rgba(129, 140, 248, 0.1)" stroke="#818cf8"/>
    <text x="525" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Order Service (gRPC)</text>

    <rect x="510" y="130" width="150" height="40" rx="6" fill="rgba(129, 140, 248, 0.1)" stroke="#818cf8"/>
    <text x="525" y="155" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Payment Service (gRPC)</text>
  </g>
</svg>
