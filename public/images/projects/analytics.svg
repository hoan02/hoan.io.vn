<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-an" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="an-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.6)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-grad-an)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="40" y="35" width="720" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="65" cy="55" r="4.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="82" cy="55" r="4.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="99" cy="55" r="4.5" fill="#10b981" opacity="0.8"/>
  <text x="130" y="59" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">app.hoan.io.vn/observability/telemetry-stream</text>

  <!-- Metric 1 -->
  <rect x="40" y="95" width="225" height="105" rx="10" fill="url(#an-card)" stroke="rgba(255,255,255,0.07)"/>
  <text x="60" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ACTIVE TELEMETRY NODES</text>
  <text x="60" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="700">1,420</text>
  <text x="60" y="182" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11">Next.js App Router + RSC</text>

  <!-- Metric 2 -->
  <rect x="285" y="95" width="225" height="105" rx="10" fill="url(#an-card)" stroke="rgba(255,255,255,0.07)"/>
  <text x="305" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">CLICKHOUSE QUERY LATENCY</text>
  <text x="305" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="700">14 ms</text>
  <text x="305" y="182" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">Columnar High-compression</text>

  <!-- Metric 3 -->
  <rect x="530" y="95" width="230" height="105" rx="10" fill="url(#an-card)" stroke="rgba(255,255,255,0.07)"/>
  <text x="550" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">LIGHTHOUSE SCORE</text>
  <text x="550" y="158" fill="#34d399" font-family="system-ui, sans-serif" font-size="26" font-weight="700">100 / 100</text>
  <text x="550" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Core Web Vitals Optimal</text>

  <!-- Chart & Histogram Visual -->
  <rect x="40" y="220" width="720" height="240" rx="12" fill="url(#an-card)" stroke="rgba(255,255,255,0.07)"/>
  
  <!-- Bar chart bars -->
  <g fill="rgba(129, 140, 248, 0.45)">
    <rect x="70" y="360" width="28" height="60" rx="4"/>
    <rect x="110" y="320" width="28" height="100" rx="4"/>
    <rect x="150" y="290" width="28" height="130" rx="4"/>
    <rect x="190" y="310" width="28" height="110" rx="4"/>
    <rect x="230" y="270" width="28" height="150" rx="4" fill="#818cf8"/>
    <rect x="270" y="250" width="28" height="170" rx="4" fill="#c084fc"/>
    <rect x="310" y="280" width="28" height="140" rx="4" fill="#818cf8"/>
    <rect x="350" y="330" width="28" height="90" rx="4"/>
    <rect x="390" y="300" width="28" height="120" rx="4"/>
    <rect x="430" y="260" width="28" height="160" rx="4" fill="#10b981"/>
    <rect x="470" y="290" width="28" height="130" rx="4"/>
    <rect x="510" y="340" width="28" height="80" rx="4"/>
    <rect x="550" y="310" width="28" height="110" rx="4"/>
    <rect x="590" y="270" width="28" height="150" rx="4"/>
    <rect x="630" y="290" width="28" height="130" rx="4"/>
    <rect x="670" y="350" width="28" height="70" rx="4"/>
  </g>

  <!-- Legend -->
  <text x="70" y="255" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Real-Time Aggregations per Second</text>
  <circle cx="680" cy="250" r="4" fill="#10b981"/>
  <text x="692" y="254" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">SSE Stream</text>
</svg>
